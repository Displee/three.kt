plugins {
    id "java-library"
    id "org.jetbrains.kotlin.jvm" version "1.5.10" apply(false)
}

group = "info.laht.threekt"
version = "r1-ALPHA-39"

subprojects { sub ->

    apply plugin: 'java'
    apply plugin: 'kotlin'

    sub.group = rootProject.group
    sub.version = rootProject.version

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib"
    }

}
